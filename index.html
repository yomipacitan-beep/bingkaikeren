<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BingkaiKeren — Buat Bingkai Foto Kampanye Jadi Lebih Keren</title>
<meta name="description" content="Buat twibbon dan bingkai foto kampanye langsung di perangkatmu. Tanpa akun, tanpa unggah ke server.">
<meta name="theme-color" content="#6A00FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BingkaiKeren">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
<style>
:root{
  --brand:#6A00FF; --brand-2:#8B5CF6; --brand-ink:#5B00DB; --brand-soft:#F1EAFF; --on-brand:#FFFFFF;
  --cyan:#06B6D4; --sun:#FACC15;
  --dark:#14123B; --bg:#F8F7FC; --surface:#FFFFFF; --surface-2:#F3F4F6;
  --text:#14123B; --muted:#5F6178; --line:#E7E4F2; --danger:#C2410C; --danger-soft:#FFF1EA;
  --warn:#8A5A00; --warn-soft:#FEF8E1;
  --stage:#ECE9F5; --shadow:0 1px 2px rgba(20,18,59,.06), 0 10px 28px -14px rgba(76,29,149,.28);
  --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display:"Poppins", "Inter", system-ui, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brand-ink:#C4A8FF; --brand-soft:#2B2050; --bg:#13111C; --surface:#1E1B2B; --surface-2:#292540;
    --text:#F3F1FA; --muted:#ABA8C2; --line:#353049; --danger:#FB923C; --danger-soft:#3A2418;
    --warn:#FCD34D; --warn-soft:#3A3018; --stage:#0E0C16; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --brand-ink:#C4A8FF; --brand-soft:#2B2050; --bg:#13111C; --surface:#1E1B2B; --surface-2:#292540;
  --text:#F3F1FA; --muted:#ABA8C2; --line:#353049; --danger:#FB923C; --danger-soft:#3A2418;
  --warn:#FCD34D; --warn-soft:#3A3018; --stage:#0E0C16; --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--font);-webkit-font-smoothing:antialiased;min-height:100%}
img,canvas,svg{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-ink)}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ---------- app chrome ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--bg)}
.topbar-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 20px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font:700 20px/1 var(--display);letter-spacing:-.02em}
.logo-mark{width:36px;height:36px;flex:none}
.logo b{font-weight:700;color:var(--brand-ink)}
.nav{display:flex;gap:4px;margin-left:auto}
.nav a{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:12px;text-decoration:none;color:var(--muted);font-weight:600;font-size:15px}
.nav a:hover{color:var(--text);background:var(--surface-2)}
.nav a[aria-current="page"]{color:var(--text);background:var(--brand-soft)}
.tabbar{display:none}
.banner{max-width:1120px;margin:12px auto 0;padding:10px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner[hidden]{display:none}
main.page{max-width:1120px;margin:0 auto;padding:28px 20px 64px}
@media (max-width:760px){
  .nav{display:none}
  .topbar-in{padding:10px 16px}
  main.page{padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600;min-height:52px;justify-content:center}
  .tabbar a[aria-current="page"]{color:var(--text);background:var(--brand-soft)}
  .tabbar .ico{width:22px;height:22px}
  .banner{margin:10px 16px 0}
}
body.in-editor .topbar, body.in-editor .tabbar, body.in-editor .banner{display:none}

/* ---------- type ---------- */
h1,h2,h3{font-family:var(--display);letter-spacing:-.02em;margin:0;line-height:1.12}
h1{font-size:clamp(32px,5.2vw,56px);font-weight:700}
h1 em{font-style:normal;color:var(--brand-ink)}
h2{font-size:clamp(22px,2.8vw,30px);font-weight:700}
h3{font-size:18px;font-weight:600;letter-spacing:-.01em}
p{margin:0}
.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:34ch}
.muted{color:var(--muted)}
.small{font-size:14px}
.page-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;margin-bottom:22px}
.page-head p{color:var(--muted);margin-top:6px;max-width:60ch}
.section{margin-top:56px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
.section-head a{font-weight:600;font-size:15px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:600 15px/1 var(--display);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:color-mix(in srgb,var(--text) 25%,var(--line))}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn-primary:hover{background:#5800D6;border-color:#5800D6}
.btn-primary{box-shadow:0 8px 20px -10px rgba(106,0,255,.7)}
.btn-dark{background:var(--dark);border-color:var(--dark);color:#fff}
:root[data-theme="dark"] .btn-dark{background:#F1F5F9;color:#1D1D1D;border-color:#F1F5F9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-dark{background:#F1F5F9;color:#1D1D1D;border-color:#F1F5F9}}
.btn-ghost{background:transparent;border-color:transparent}
.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{color:var(--danger)}
.btn-danger:hover{background:var(--danger-soft);border-color:transparent}
.btn-lg{min-height:56px;padding:0 26px;font-size:16.5px;border-radius:16px}
.btn-sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:11px}
.icon-btn{width:44px;height:44px;padding:0;min-height:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:grid;gap:6px;margin-bottom:18px}
.field label,.label{font-weight:600;font-size:14.5px}
.field .hint{font-size:13.5px;color:var(--muted)}
.input,select.input,textarea.input{width:100%;min-height:48px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px}
textarea.input{min-height:92px;resize:vertical}
.input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 30%,transparent)}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.seg button{border:0;background:transparent;padding:9px 14px;border-radius:10px;font-weight:600;font-size:14.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
input[type=range]{width:100%;accent-color:var(--brand);height:28px}
.range{display:grid;gap:2px}
.range-top{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.range-top output{color:var(--muted);font-variant-numeric:tabular-nums;font-weight:500}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--muted)}
.pill.brand{background:var(--brand-soft);color:var(--brand-ink)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:var(--brand-soft);color:var(--text);font-size:14.5px}
.note .ico{color:var(--brand-ink);margin-top:2px}
.note.warn{background:var(--warn-soft)}
.note.warn .ico{color:var(--warn)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;padding:12px 0 8px}
.hero h1{max-width:14ch}
.hero .lead{margin-top:16px;max-width:40ch}
.hero .row{margin-top:28px}
.hero-quick{margin-top:16px;font-size:15px;color:var(--muted)}
.hero-art{position:relative;border-radius:32px;background:radial-gradient(120% 90% at 70% 20%,#FFFFFF 0%,#F1EAFF 55%,#E3D4FF 100%);overflow:hidden;aspect-ratio:598/425}
.hero-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
.hero-badge{position:absolute;right:16px;bottom:16px;display:flex;align-items:center;gap:10px;background:#fff;color:#14123B;border-radius:16px;padding:10px 14px 10px 10px;font:600 14px/1.2 var(--display);box-shadow:0 10px 30px -12px rgba(76,29,149,.45)}
.hero-badge svg{width:34px;height:34px}
@media (max-width:860px){.hero{grid-template-columns:1fr;gap:20px}.hero-art{order:-1}}
.mascot{width:96px;height:96px;border-radius:50%;object-fit:cover;background:#F1EAFF}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.proj{display:flex;flex-direction:column;overflow:hidden}
.proj-thumb{aspect-ratio:1;background:var(--stage) center/cover no-repeat;border-bottom:1px solid var(--line);cursor:pointer;display:grid;place-items:center;color:var(--muted)}
.proj-thumb img{width:100%;height:100%;object-fit:contain}
.proj-body{padding:14px 14px 12px;display:grid;gap:6px}
.proj-body h3{font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-meta{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);flex-wrap:wrap}
.proj-actions{display:flex;gap:4px;padding:0 8px 10px;margin-top:auto}
.proj-actions .btn{flex:1;padding:0 8px}
.empty{padding:40px 24px;text-align:center;display:grid;justify-items:center;gap:12px;border:1.5px dashed var(--line);border-radius:20px}
.empty p{color:var(--muted);max-width:42ch}
.tpl{padding:12px;display:grid;gap:10px;cursor:pointer;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px}
.tpl:hover{border-color:var(--brand)}
.tpl canvas{width:100%;height:auto;border-radius:12px;background:var(--stage)}
.tpl strong{font-size:15.5px}
.tpl span{font-size:13.5px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;counter-reset:s}
.steps li{list-style:none;padding:18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);counter-increment:s}
.steps li{position:relative}
.steps li::before{content:counter(s);position:absolute;top:14px;right:16px;font:700 14px var(--display);color:var(--muted)}
.ftile{width:56px;height:56px;border-radius:16px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand-ink);margin-bottom:14px}
.ftile .ico{width:28px;height:28px;stroke-width:1.8}
.steps strong{display:block;margin-bottom:4px}
.steps p{font-size:14.5px;color:var(--muted)}
.steps{padding:0;margin:0}
@media (max-width:860px){.steps{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.steps{grid-template-columns:1fr}}

/* ---------- wizard ---------- */
.wiz{display:grid;grid-template-columns:220px 1fr;gap:32px;align-items:start}
.wiz-steps{list-style:none;margin:0;padding:0;display:grid;gap:4px;position:sticky;top:90px}
.wiz-steps li{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:600;font-size:15px}
.wiz-steps li b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:13px;flex:none}
.wiz-steps li[aria-current="step"]{color:var(--text);background:var(--surface)}
.wiz-steps li[aria-current="step"] b{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.wiz-steps li.done b{background:var(--brand-soft);border-color:var(--brand-soft);color:var(--brand-ink)}
.wiz-panel{padding:26px}
.wiz-panel h2{margin-bottom:6px}
.wiz-panel > p{color:var(--muted);margin-bottom:22px}
.wiz-foot{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
@media (max-width:860px){
  .wiz{grid-template-columns:1fr;gap:14px}
  .wiz-steps{position:static;grid-auto-flow:column;grid-template-columns:repeat(5,1fr);gap:6px}
  .wiz-steps li{flex-direction:column;gap:4px;padding:8px 2px;font-size:11.5px;text-align:center}
  .wiz-panel{padding:20px 16px}
}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.type{position:relative;text-align:left;padding:18px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;display:grid;gap:8px}
.type[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.type[disabled]{cursor:not-allowed;opacity:.6}
.type .pill{justify-self:start}
.type p{font-size:14px;color:var(--muted)}
.type svg.art{width:56px;height:56px}
@media (max-width:700px){.types{grid-template-columns:1fr}}
.drop{display:grid;place-items:center;gap:8px;padding:28px 16px;border:1.5px dashed var(--line);border-radius:18px;text-align:center;cursor:pointer;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop input{position:absolute;opacity:0;pointer-events:none;width:1px}
.drop .ico{width:28px;height:28px;color:var(--brand-ink)}
.asset{display:flex;gap:14px;align-items:center;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.asset .thumb{width:84px;height:84px;border-radius:12px;flex:none;background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface) 0 50%) 0 0/16px 16px;display:grid;place-items:center;overflow:hidden}
.asset .thumb img{max-height:100%;object-fit:contain}
.asset-info{flex:1;min-width:0;display:grid;gap:2px;font-size:14px}
.asset-info strong{font-size:15px}
.config{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.config canvas{width:100%;height:auto;border-radius:14px;box-shadow:var(--shadow);background:var(--stage)}
@media (max-width:760px){.config{grid-template-columns:1fr}}
.summary{display:grid;grid-template-columns:140px 1fr;gap:20px;align-items:start}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:15px}
.summary dt{color:var(--muted)}
.summary dd{margin:0;font-weight:600}
@media (max-width:520px){.summary{grid-template-columns:1fr}}

/* ---------- editor ---------- */
.editor{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-columns:260px 1fr 300px;grid-template-rows:auto 1fr;grid-template-areas:"top top top" "left stage right";padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.ed-top{grid-area:top;display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line);background:var(--surface)}
.ed-title{flex:1;min-width:0;display:grid;line-height:1.2;padding:0 6px}
.ed-title strong{font-size:16px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ed-title span{font-size:12.5px;color:var(--muted)}
.ed-top .sep{width:1px;height:26px;background:var(--line);margin:0 4px}
.ed-left,.ed-right{background:var(--surface);overflow:auto;padding:16px}
.ed-left{grid-area:left;border-right:1px solid var(--line);display:grid;align-content:start;gap:10px}
.ed-right{grid-area:right;border-left:1px solid var(--line)}
.ed-left h4,.tool h4{margin:6px 0 2px;font:600 13px/1.3 var(--font);color:var(--muted)}
.ed-left .btn{justify-content:flex-start;width:100%}
.ed-stage{grid-area:stage;position:relative;display:grid;place-items:center;padding:24px;background:var(--stage);min-height:0;min-width:0;overflow:hidden}
.ed-stage canvas{touch-action:none;cursor:grab;box-shadow:0 18px 50px -20px rgba(0,0,0,.45);background:#fff;border-radius:4px}
.ed-stage canvas:active{cursor:grabbing}
.stage-hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:13px;color:var(--muted);background:var(--surface);padding:5px 12px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tool{padding:4px 0 18px;border-bottom:1px solid var(--line);margin-bottom:16px;display:grid;gap:12px}
.tool:last-child{border-bottom:0}
.tool-head{display:flex;justify-content:space-between;align-items:center}
.tool-head h3{font-size:16px}
.nudge{display:grid;grid-template-columns:repeat(3,44px);gap:6px;justify-content:center}
.nudge .btn{width:44px;height:44px;min-height:0;padding:0}
.ed-bottom{display:none}
.save-state{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.save-state i{width:8px;height:8px;border-radius:50%;background:var(--brand);display:inline-block}
@media (max-width:1023px){
  .editor{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto;grid-template-areas:"top" "stage" "right" "bottom"}
  .ed-left{display:none}
  .ed-stage{padding:14px}
  .ed-right{border-left:0;border-top:1px solid var(--line);max-height:42vh;padding:14px 16px 6px}
  .ed-right .tool{display:none;border:0;margin:0;padding:0 0 10px}
  .ed-right .tool.active{display:grid}
  .ed-right:not(.open){display:none}
  .ed-bottom{grid-area:bottom;display:grid;grid-template-columns:repeat(7,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .ed-bottom button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border:0;background:transparent;border-radius:12px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;padding:0}
  .ed-bottom button[aria-pressed="true"]{color:var(--text);background:var(--brand-soft)}
  .ed-bottom button.primary{color:var(--brand-ink)}
  .ed-bottom .ico{width:22px;height:22px}
  .ed-top .hide-m{display:none}
  .stage-hint{bottom:8px;font-size:12px}
}

@media (min-width:1024px){.tool.m-only{display:none}}

/* ---------- details ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
.detail .preview{border-radius:20px;overflow:hidden;background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface) 0 50%) 0 0/20px 20px;border:1px solid var(--line)}
.detail .preview img{width:100%}
.detail-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;font-size:15px;margin:16px 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}
.assets-row{display:flex;gap:10px;flex-wrap:wrap}
.assets-row figure{margin:0;width:96px;font-size:12.5px;color:var(--muted);text-align:center}
.assets-row figure div{aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface) 0 50%) 0 0/12px 12px;display:grid;place-items:center;overflow:hidden;margin-bottom:4px}
.assets-row img{max-height:100%;object-fit:contain}
@media (max-width:820px){.detail{grid-template-columns:1fr}}

/* ---------- settings / help ---------- */
.stack{display:grid;gap:16px;max-width:760px}
.set{padding:20px;display:grid;gap:12px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.set-row > div{display:grid;gap:2px;max-width:46ch}
.set-row p{font-size:14px;color:var(--muted)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--brand)}
details.faq{padding:16px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
details.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::after{content:"+";font:600 20px/1 var(--display);color:var(--muted)}
details.faq[open] summary::after{content:"–"}
details.faq p{margin-top:10px;color:var(--muted);font-size:15px}

/* ---------- dialogs & toast ---------- */
dialog{border:0;padding:0;border-radius:22px;background:var(--surface);color:var(--text);width:min(520px,calc(100vw - 32px));max-height:calc(100dvh - 40px);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(15,23,42,.55)}
.dlg{padding:22px;display:grid;gap:14px}
.dlg h2{font-size:22px}
.dlg-foot{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:6px}
dialog.wide{width:min(900px,calc(100vw - 24px))}
.preview-img{max-height:min(68dvh,720px);margin:0 auto;border-radius:10px;background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface) 0 50%) 0 0/16px 16px;object-fit:contain}
.share-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.share-grid .btn{justify-content:flex-start}
.tpl-dlg{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.tpl-dlg canvas{width:100%;height:auto;border-radius:14px;background:repeating-conic-gradient(var(--surface-2) 0 25%,var(--surface) 0 50%) 0 0/16px 16px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:36px;height:36px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--text)}
@media (max-width:620px){.tpl-dlg{grid-template-columns:1fr}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:100;display:grid;gap:8px;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--text);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14.5px;box-shadow:var(--shadow);animation:pop .2s ease-out}
.toast.err{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger)}
@keyframes pop{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}*{scroll-behavior:auto}}

<script>
"use strict";
/* =========================================================
   BingkaiKeren — aplikasi twibbon 100% di perangkat
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const icon = (id, cls = "ico") => `<svg class="${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const fmtDate = (t) => new Date(t).toLocaleDateString("id-ID", { day: "numeric", month: "short", year: "numeric" });
const fmtBytes = (b) => b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(0) + " KB" : (b / 1048576).toFixed(1) + " MB";
const slug = (s) => (String(s || "campaign").toLowerCase().normalize("NFKD").replace(/[^\w\s-]/g, "").trim().replace(/[\s_]+/g, "-").slice(0, 48) || "campaign");
const deepClone = (o) => JSON.parse(JSON.stringify(o));
const sleep = (ms) => new Promise(r => setTimeout(r, ms));

const LIMITS = {
  fileBytes: 15 * 1024 * 1024,   // per uploaded image
  zipBytes: 80 * 1024 * 1024,    // per imported package
  maxSide: 4096,                 // longest side kept after upload
  maxPixels: 16_000_000,         // keeps iOS canvas memory safe
  inputPixels: 60_000_000        // refuse absurd source images
};
const IMG_TYPES = ["image/png", "image/jpeg", "image/webp"];
const CATEGORIES = ["Pendidikan", "Acara", "Komunitas", "Pemerintahan", "Kesehatan", "Keagamaan", "Olahraga", "Perayaan", "Lingkungan", "Lainnya"];
const OLD_CATEGORY = { Education: "Pendidikan", Event: "Acara", Community: "Komunitas", Government: "Pemerintahan", Health: "Kesehatan", Religion: "Keagamaan", Sport: "Olahraga", Celebration: "Perayaan", Other: "Lainnya" };
const TYPE_LABEL = { frame: "Twibbon bingkai", background: "Twibbon latar" };
const SIZE_PRESETS = [
  { id: "square", label: "Persegi · 1080 × 1080", w: 1080, h: 1080 },
  { id: "portrait", label: "Potret · 1080 × 1350", w: 1080, h: 1350 },
  { id: "story", label: "Story · 1080 × 1920", w: 1080, h: 1920 },
  { id: "landscape", label: "Lanskap · 1200 × 630", w: 1200, h: 630 }
];

/* ---------- toasts & dialogs ---------- */
function toast(msg, kind = "") {
  const t = document.createElement("div");
  t.className = "toast " + kind; t.textContent = msg;
  $("#toasts").append(t);
  setTimeout(() => t.remove(), kind === "err" ? 5200 : 3200);
}
const dlg = $("#dlg");
function openDialog(html, { wide = false, onClose } = {}) {
  dlg.className = wide ? "wide" : "";
  dlg.innerHTML = html;
  dlg.onclose = () => { dlg.innerHTML = ""; onClose && onClose(); };
  if (!dlg.open) dlg.showModal();
  return dlg;
}
function closeDialog() { if (dlg.open) dlg.close(); }
dlg.addEventListener("click", e => { if (e.target === dlg) closeDialog(); });
function confirmBox({ title, body, ok = "Ya, lanjutkan", danger = false }) {
  return new Promise(res => {
    let answer = false;
    openDialog(`<form method="dialog" class="dlg"><h2>${esc(title)}</h2><p class="muted">${body}</p>
      <div class="dlg-foot"><button class="btn" value="no">Batal</button>
      <button class="btn ${danger ? "btn-dark" : "btn-primary"}" value="yes" id="okBtn">${esc(ok)}</button></div></form>`,
      { onClose: () => res(answer) });
    $("#okBtn").onclick = () => { answer = true; };
  });
}

/* ---------- preferences (localStorage, lightweight only) ---------- */
const Prefs = {
  defaults: { theme: "system", format: "png", quality: 92, fill: "#FFFFFF", seenHint: false },
  get(k) { try { const v = JSON.parse(localStorage.getItem("ch.prefs") || "{}"); return k in v ? v[k] : this.defaults[k]; } catch { return this.defaults[k]; } },
  set(k, val) { try { const v = JSON.parse(localStorage.getItem("ch.prefs") || "{}"); v[k] = val; localStorage.setItem("ch.prefs", JSON.stringify(v)); } catch { } }
};
function applyTheme() {
  const t = Prefs.get("theme");
  if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}
applyTheme();

/* ---------- IndexedDB (with in-memory fallback) ---------- */
const DB = (() => {
  let db = null; const mem = new Map(); let ok = false;
  async function open() {
    if (!("indexedDB" in window)) return false;
    try {
      db = await new Promise((res, rej) => {
        const r = indexedDB.open("campaignhub", 1);
        r.onupgradeneeded = () => { const d = r.result; if (!d.objectStoreNames.contains("projects")) d.createObjectStore("projects", { keyPath: "id" }); };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error("blocked"));
        setTimeout(() => rej(new Error("timeout")), 6000);
      });
      // Probe a write so private modes that "open" but cannot store are caught.
      await run("readwrite", s => s.put({ id: "__probe", t: Date.now() }));
      await run("readwrite", s => s.delete("__probe"));
      ok = true;
    } catch (e) { console.warn("IndexedDB unavailable", e); db = null; ok = false; }
    return ok;
  }
  function run(mode, fn) {
    return new Promise((res, rej) => {
      const tx = db.transaction("projects", mode); const st = tx.objectStore("projects");
      const req = fn(st); let out;
      if (req) req.onsuccess = () => { out = req.result; };
      tx.oncomplete = () => res(out);
      tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error("Penyimpanan dibatalkan oleh browser."));
    });
  }
  return {
    open, get ok() { return ok; },
    async all() { const list = ok ? await run("readonly", s => s.getAll()) : [...mem.values()]; return list.filter(p => p.id !== "__probe").sort((a, b) => b.updatedAt - a.updatedAt); },
    async get(id) { return ok ? run("readonly", s => s.get(id)) : mem.get(id); },
    async put(p) {
      if (!ok) { mem.set(p.id, p); return; }
      try { await run("readwrite", s => s.put(p)); }
      catch (e) {
        if (e && (e.name === "QuotaExceededError" || /quota/i.test(e.message))) throw new Error("Ruang penyimpanan di perangkat ini penuh. Hapus proyek lama atau ekspor sebagai ZIP, lalu coba lagi.");
        throw e;
      }
    },
    async del(id) { if (!ok) { mem.delete(id); return; } await run("readwrite", s => s.delete(id)); },
    async clear() { if (!ok) { mem.clear(); return; } await run("readwrite", s => s.clear()); }
  };
})();

/* ---------- object URLs (released on every route change) ---------- */
const viewURLs = new Set();
function objURL(blob) { const u = URL.createObjectURL(blob); viewURLs.add(u); return u; }
function releaseViewURLs() { viewURLs.forEach(u => URL.revokeObjectURL(u)); viewURLs.clear(); }

/* ---------- image helpers ---------- */
function blobToImage(blob) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(blob); const img = new Image();
    img.onload = () => { URL.revokeObjectURL(u); res(img); };
    img.onerror = () => { URL.revokeObjectURL(u); rej(new Error("Gambar ini tidak bisa dibuka. Mungkin rusak atau formatnya tidak didukung.")); };
    img.src = u;

<script>
"use strict";
const view = $("#view");

/* ---------- project helpers ---------- */
function newProject() {
  const now = Date.now();
  return { id: uid(), title: "", description: "", category: "Pendidikan", type: "frame", createdAt: now, updatedAt: now,
    output: { w: 1080, h: 1080, preset: "frame" }, placement: { fit: "cover", zoom: 1, ox: 0, oy: 0 }, fill: Prefs.get("fill"),
    templateUrl: "", assets: {}, editor: null };
}
async function renderPreviewBlob(p, maxSide = 520) {
  const k = Math.min(1, maxSide / Math.max(p.output.w, p.output.h));
  const c = makeCanvas(Math.round(p.output.w * k), Math.round(p.output.h * k));
  const frame = p.assets.frame ? await blobToImage(p.assets.frame) : null;
  const bg = p.assets.background ? await blobToImage(p.assets.background) : null;
  let photo = null, ps = null;
  if (p.assets.photo && p.editor && p.editor.photo) { photo = await blobToImage(p.assets.photo); ps = p.editor.photo; }
  else { photo = samplePhoto(); ps = initialPhotoState(photo, p); }
  compose(c.getContext("2d"), { W: p.output.w, H: p.output.h, k, fill: p.fill, bg, frame, photo, ps });
  return canvasToBlob(c, "image/png");
}
async function duplicateProject(p) {
  const copy = { ...p, id: uid(), title: (p.title || "Tanpa judul") + " (salinan)", createdAt: Date.now(), updatedAt: Date.now(), assets: { ...p.assets }, editor: p.editor ? deepClone(p.editor) : null };
  await DB.put(copy); toast("Proyek diduplikat. Salinannya ada di urutan teratas."); return copy;
}
async function deleteProject(p) {
  const yes = await confirmBox({ title: "Hapus proyek ini?", body: `“${esc(p.title || "Tanpa judul")}” akan dihapus dari perangkat ini dan tidak bisa dikembalikan. Ekspor sebagai ZIP dulu kalau mungkin masih diperlukan.`, ok: "Hapus proyek", danger: true });
  if (!yes) return false;
  await DB.del(p.id); toast("Proyek dihapus."); return true;
}
function projectCard(p) {
  const thumb = p.assets.cover ? `<img src="${objURL(p.assets.cover)}" alt="" style="object-fit:cover">` : p.assets.preview ? `<img src="${objURL(p.assets.preview)}" alt="">` : icon("image");
  return `<article class="card proj" data-id="${esc(p.id)}">
    <div class="proj-thumb" data-act="open" role="button" tabindex="0" aria-label="Buka ${esc(p.title || "Tanpa judul")}">${thumb}</div>
    <div class="proj-body"><h3>${esc(p.title || "Tanpa judul")}</h3>
      <div class="proj-meta"><span class="pill ${p.type === "frame" ? "brand" : ""}">${TYPE_LABEL[p.type] || p.type}</span><span>${fmtDate(p.createdAt)}</span></div></div>
    <div class="proj-actions">
      <button class="btn btn-sm btn-ghost" data-act="edit">${icon("edit")}Edit</button>
      <button class="btn btn-sm btn-ghost" data-act="dup" aria-label="Duplikat">${icon("copy")}</button>
      <button class="btn btn-sm btn-ghost btn-danger" data-act="del" aria-label="Hapus">${icon("trash")}</button>
    </div></article>`;
}
function bindProjectCards(root, list, after) {
  root.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const card = b.closest("[data-id]"); const p = list.find(x => x.id === card.dataset.id); if (!p) return;
    const act = b.dataset.act;
    if (act === "open") location.hash = "project-" + p.id;
    if (act === "edit") location.hash = "editor-" + p.id;
    if (act === "dup") { await duplicateProject(p); after(); }
    if (act === "del") { if (await deleteProject(p)) after(); }
  });
  root.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches("[data-act=open]")) e.target.click(); });
}
function emptyState(img, title, text, actions) {
  return `<div class="empty"><img class="mascot" src="${img}" alt=""><h3>${title}</h3><p>${text}</p>${actions}</div>`;
}

/* ---------- CAMPAIGN SIAP PAKAI (campaigns.json di hosting yang sama) ---------- */
let campaignsCache = null;
const safeName = (n) => typeof n === "string" && /^[A-Za-z0-9._\/-]{1,120}$/.test(n) && !n.includes("..") && !n.startsWith("/");
async function loadCampaigns() {
  if (campaignsCache) return campaignsCache;
  if (!/^https?:$/.test(location.protocol)) return [];
  try {
    const res = await fetch("campaigns.json", { cache: "no-cache" });
    if (!res.ok) return [];
    const data = await res.json();
    const list = (Array.isArray(data) ? data : data.campaigns || []).filter(c => c && c.active !== false && typeof c.id === "string" && /^[a-z0-9-]{1,60}$/.test(c.id) && typeof c.title === "string" && (safeName(c.frame) || safeName(c.background)));
    campaignsCache = list.slice(0, 40);
    return campaignsCache;
  } catch { return []; }
}
async function fetchAsset(name) {
  const res = await fetch(name); if (!res.ok) throw new Error(`File ${name} tidak ditemukan di situs.`);
  const blob = await res.blob(); if (blob.size > LIMITS.fileBytes) throw new Error(`${name} terlalu besar.`);
  const type = sniffType(new Uint8Array(await blob.slice(0, 12).arrayBuffer())); if (!type) throw new Error(`${name} bukan gambar PNG, JPG, atau WEBP.`);
  return new Blob([blob], { type });
}
async function campaignToProject(c) {
  const p = newProject();
  p._quick = true; p._campaign = c.id; p.title = c.title.slice(0, 120); p.description = String(c.description || "").slice(0, 600);
  p.category = CATEGORIES.includes(c.category) ? c.category : "Lainnya";
  p.type = c.type === "background" ? "background" : "frame";
  if (safeName(c.frame)) p.assets.frame = await fetchAsset(c.frame);
  if (safeName(c.background)) p.assets.background = await fetchAsset(c.background);
  const ref = await blobToImage(p.assets.frame || p.assets.background);
  const w = Number(c.output && c.output.w), h = Number(c.output && c.output.h);
  p.output = (w >= 100 && h >= 100 && Math.max(w, h) <= LIMITS.maxSide && w * h <= LIMITS.maxPixels) ? { w: Math.round(w), h: Math.round(h), preset: "custom" } : { w: ref.naturalWidth, h: ref.naturalHeight, preset: "frame" };
  const pl = c.placement || {};
  p.placement = { fit: pl.fit === "contain" ? "contain" : "cover", zoom: clamp(Number(pl.zoom) || 1, .1, 5), ox: clamp(Number(pl.ox) || 0, -.5, .5), oy: clamp(Number(pl.oy) || 0, -.5, .5) };
  if (/^#[0-9a-f]{6}$/i.test(c.fill || "")) p.fill = c.fill;
  return p;
}
const campaignURL = (id) => appLink() + "#pakai-" + id;
function campaignCard(c) {
  const thumb = safeName(c.cover) ? c.cover : null;
  return `<article class="card proj" data-cid="${esc(c.id)}">
    <div class="proj-thumb" data-cact="use" role="button" tabindex="0" aria-label="Pakai ${esc(c.title)}">${thumb ? `<img src="${esc(thumb)}" alt="" style="object-fit:cover">` : `<canvas data-cthumb="${esc(c.id)}" width="540" height="540" style="width:100%;height:100%"></canvas>`}</div>
    <div class="proj-body"><h3>${esc(c.title)}</h3>${c.description ? `<p class="small muted" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(c.description)}</p>` : ""}</div>
    <div class="proj-actions">
      <button class="btn btn-sm btn-primary" data-cact="use" style="flex:3">${icon("image")}Pakai bingkai</button>
      <button class="btn btn-sm btn-ghost" data-cact="link" aria-label="Salin link campaign">${icon("link")}</button>
    </div></article>`;
}
async function drawCampaignThumbs(root, list) {
  for (const cv of $$("[data-cthumb]", root)) {
    const c = list.find(x => x.id === cv.dataset.cthumb); if (!c) continue;
    try {
      const frame = safeName(c.frame) ? await blobToImage(await fetchAsset(c.frame)) : null;
      const bg = safeName(c.background) ? await blobToImage(await fetchAsset(c.background)) : null;
      const ref = frame || bg, W = ref.naturalWidth, H = ref.naturalHeight, k = 540 / Math.max(W, H);
      cv.width = Math.round(W * k); cv.height = Math.round(H * k);
      const ph = samplePhoto();
      compose(cv.getContext("2d"), { W, H, k, fill: c.fill || "#FFFFFF", bg, frame, photo: ph, ps: initialPhotoState(ph, { output: { w: W, h: H }, placement: c.placement }) });
    } catch { }
  }
}
function bindCampaignCards(root, list) {
  root.addEventListener("click", async e => {
    const b = e.target.closest("[data-cact]"); if (!b) return;

/* ---------- ZIP export / import ---------- */
function needZip() {
  if (window.JSZip) return window.JSZip;
  throw new Error("Alat ZIP belum termuat. Sambungkan internet sekali, muat ulang halaman, lalu coba lagi.");
}
async function exportZip(p) {
  try {
    const JSZip = needZip(); const zip = new JSZip(); const files = {};
    for (const key of ["cover", "frame", "background", "preview"]) {
      const b = p.assets[key]; if (!b) continue;
      const name = `${key}.${extFor(b.type)}`; zip.file(name, b); files[key] = name;
    }
    const meta = { format: "campaignhub-project", app: "BingkaiKeren", version: 1, exportedAt: new Date().toISOString(),
      project: { title: p.title, description: p.description, category: p.category, type: p.type, output: p.output, placement: p.placement, fill: p.fill, templateUrl: p.templateUrl || "", createdAt: p.createdAt, updatedAt: p.updatedAt },
      files };
    zip.file("project.json", JSON.stringify(meta, null, 2));
    const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE", compressionOptions: { level: 6 } });
    if (await saveFile(blob, `${slug(p.title)}-campaign.zip`)) toast("ZIP berhasil diekspor. Foto pribadimu tidak ikut di dalamnya.");
  } catch (e) { toast(e.message || "Ekspor gagal.", "err"); }
}
async function importZip(file) {
  const JSZip = needZip();
  if (file.size > LIMITS.zipBytes) throw new Error(`ZIP ini berukuran ${fmtBytes(file.size)}. Batasnya ${fmtBytes(LIMITS.zipBytes)}.`);
  let zip; try { zip = await JSZip.loadAsync(file); } catch { throw new Error("File ini bukan paket ZIP yang valid."); }
  const pj = zip.file("project.json") || zip.file(/(^|\/)project\.json$/)[0];
  if (!pj) throw new Error("ZIP ini tidak berisi project.json, jadi bukan proyek BingkaiKeren.");
  const base = pj.name.slice(0, pj.name.length - "project.json".length);
  let meta; try { meta = JSON.parse(await pj.async("string")); } catch { throw new Error("project.json di dalam ZIP ini rusak (bukan JSON yang valid)."); }
  if (!meta || meta.format !== "campaignhub-project" || !meta.project) throw new Error("project.json ini bukan file proyek BingkaiKeren.");
  const m = meta.project;
  if (!["frame", "background"].includes(m.type)) throw new Error("Proyek ini memakai jenis campaign yang belum didukung versi ini.");
  const ow = Number(m.output && m.output.w), oh = Number(m.output && m.output.h);
  if (!(ow >= 100 && oh >= 100 && Math.max(ow, oh) <= LIMITS.maxSide && ow * oh <= LIMITS.maxPixels)) throw new Error("Ukuran hasil di project.json kosong atau di luar batas.");
  const cat = CATEGORIES.includes(m.category) ? m.category : (OLD_CATEGORY[m.category] || "Lainnya");
  const p = newProject();
  Object.assign(p, { title: String(m.title || "Campaign impor").slice(0, 120), description: String(m.description || "").slice(0, 600),
    category: cat, type: m.type, output: { w: Math.round(ow), h: Math.round(oh), preset: m.output.preset || "custom" },
    placement: { fit: m.placement && m.placement.fit === "contain" ? "contain" : "cover", zoom: clamp(Number(m.placement && m.placement.zoom) || 1, .1, 5), ox: clamp(Number(m.placement && m.placement.ox) || 0, -.5, .5), oy: clamp(Number(m.placement && m.placement.oy) || 0, -.5, .5) },
    fill: /^#[0-9a-f]{6}$/i.test(m.fill) ? m.fill : "#FFFFFF", templateUrl: typeof m.templateUrl === "string" ? m.templateUrl.slice(0, 500) : "" });
  const files = meta.files || {};
  for (const key of ["cover", "frame", "background", "preview"]) {
    const name = files[key]; if (!name) continue;
    if (typeof name !== "string" || !new RegExp(`^${key}\\.(png|jpe?g|webp)$`, "i").test(name)) throw new Error(`Nama file untuk ${key} di project.json tidak diizinkan.`);
    const zf = zip.file(base + name); if (!zf) throw new Error(`project.json menyebut ${name}, tetapi file itu tidak ada di dalam ZIP.`);
    const bytes = await zf.async("uint8array");
    if (bytes.length > LIMITS.fileBytes) throw new Error(`${name} lebih besar dari ${fmtBytes(LIMITS.fileBytes)}.`);
    const type = sniffType(bytes); if (!type) throw new Error(`${name} bukan gambar PNG, JPG, atau WEBP.`);
    const blob = new Blob([bytes], { type }); await blobToImage(blob);
    p.assets[key] = blob;
  }
  if (p.type === "frame" && !p.assets.frame) throw new Error("Campaign bingkai ini tidak punya gambar bingkai di dalam ZIP.");
  if (p.type === "background" && !p.assets.background) throw new Error("Campaign latar ini tidak punya gambar latar di dalam ZIP.");
  if (!p.assets.preview) p.assets.preview = await renderPreviewBlob(p);
  await DB.put(p);
  return p;
}
