      <div class="seg" id="themeSeg">${["system", "light", "dark"].map(t => `<button data-v="${t}" aria-pressed="${t === theme}">${themeLabel[t]}</button>`).join("")}</div></div></section>
    <section class="card set"><h3>Unduhan</h3>
      <div class="set-row"><div><strong>Format gambar</strong><p>PNG kualitasnya paling bagus. JPG ukurannya lebih kecil untuk aplikasi chat.</p></div>
      <div class="seg" id="fmtSeg">${["png", "jpg"].map(t => `<button data-v="${t}" aria-pressed="${t === fmt}">${t.toUpperCase()}</button>`).join("")}</div></div>
      <div class="range" ${fmt === "png" ? "hidden" : ""} id="qRow"><div class="range-top"><label for="q">Kualitas JPG</label><output id="qOut">${Prefs.get("quality")}%</output></div><input type="range" id="q" min="60" max="100" value="${Prefs.get("quality")}"></div>
      <div class="set-row"><div><strong>Warna area kosong</strong><p>Warna di belakang foto bila foto tidak menutupi seluruh bingkai, untuk campaign baru.</p></div><input type="color" id="fillPref" value="${Prefs.get("fill")}" style="width:56px;height:44px;border:0;background:none"></div></section>
    <section class="card set"><h3>Penyimpanan di perangkat ini</h3>
      <div id="storeInfo" class="muted small">Memeriksa…</div>
      <div class="set-row"><div><strong>Lindungi proyek</strong><p>Minta browser agar tidak membersihkan data BingkaiKeren saat ruang penyimpanan menipis.</p></div><button class="btn" id="persistBtn">Lindungi proyekku</button></div>
      <div class="set-row"><div><strong>Hapus semua proyek</strong><p>Menghapus semua proyek yang tersimpan di browser ini.</p></div><button class="btn btn-danger" id="wipeBtn">${icon("trash")}Hapus semua</button></div></section>
    <section class="card set"><h3>Aplikasi</h3>
      <div class="set-row"><div><strong>Install BingkaiKeren</strong><p>${standalone ? "Sudah ter-install. Kamu sedang memakai versi aplikasi." : "Tambahkan ke layar utama atau desktop, lalu buka walau sedang offline."}</p></div>
      <button class="btn btn-primary" id="installBtn" ${installEvt && !standalone ? "" : "hidden"}>${icon("phone")}Install aplikasi</button>
      ${!installEvt && !standalone ? `<a class="btn" href="#help">Cara install</a>` : ""}</div>
      <p class="small muted">BingkaiKeren 1.1 · tanpa akun, tanpa server, tanpa pelacakan. Gambar hanya diproses di browsermu.</p></section>
  </div>`;
  $("#themeSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; Prefs.set("theme", b.dataset.v); applyTheme(); $$("#themeSeg button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  $("#fmtSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; Prefs.set("format", b.dataset.v); $$("#fmtSeg button").forEach(x => x.setAttribute("aria-pressed", x === b)); $("#qRow").hidden = b.dataset.v === "png"; };
  $("#q").oninput = e => { $("#qOut").textContent = e.target.value + "%"; Prefs.set("quality", +e.target.value); };
  $("#fillPref").onchange = e => Prefs.set("fill", e.target.value.toUpperCase());
  $("#installBtn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); const r = await installEvt.userChoice; installEvt = null; if (r.outcome === "accepted") toast("Berhasil di-install."); route(); };
  $("#persistBtn").onclick = async () => {
    if (!navigator.storage || !navigator.storage.persist) { toast("Browser ini tidak punya pilihan tersebut. Simpan cadangan ZIP saja.", "err"); return; }
    const ok = await navigator.storage.persist(); toast(ok ? "Beres. Browser akan menjaga proyekmu." : "Browser menolak. Meng-install aplikasi biasanya membantu; tetap simpan cadangan ZIP.", ok ? "" : "err"); storeInfo();
  };
  $("#wipeBtn").onclick = async () => { if (await confirmBox({ title: "Hapus semua proyek?", body: "Semua proyek di browser ini akan dihapus dan tidak bisa dikembalikan.", ok: "Hapus semua", danger: true })) { await DB.clear(); toast("Semua proyek dihapus."); storeInfo(); } };
  storeInfo();
  async function storeInfo() {
    const el = $("#storeInfo"); if (!el) return;
    const n = (await DB.all()).length; let txt = `${n} proyek tersimpan.`, meter = "";
    if (!DB.ok) txt = "Browser ini tidak bisa menyimpan proyek, jadi tidak ada yang tersimpan setelah halaman ditutup.";
    try { if (navigator.storage && navigator.storage.estimate) { const { usage = 0, quota = 0 } = await navigator.storage.estimate(); if (quota) { txt += ` Terpakai ${fmtBytes(usage)} dari sekitar ${fmtBytes(quota)}.`; meter = `<div class="meter" style="margin-top:8px"><i style="width:${Math.max(1, Math.min(100, usage / quota * 100)).toFixed(1)}%"></i></div>`; } }
      if (navigator.storage && navigator.storage.persisted && await navigator.storage.persisted()) txt += " Terlindungi dari pembersihan otomatis."; } catch { }
    el.innerHTML = esc(txt) + meter;
  }
}

/* ---------- BANTUAN ---------- */
function viewHelp() {
  const faq = [
    ["Apa itu bingkai PNG transparan?", "Gambar PNG yang bagian untuk fotonya tembus pandang. BingkaiKeren menaruh foto di belakang bingkai, jadi foto hanya terlihat dari bagian itu. Canva dan aplikasi desain lain bisa mengekspor PNG dengan latar transparan. Kalau belum punya, pakai contoh desain bingkai di Beranda."],
    ["Di mana proyekku disimpan?", "Hanya di browser ini, di perangkat ini, dalam database lokal browser. Tidak ada yang diunggah. Browser lain, HP lain, atau jendela incognito tidak akan melihatnya."],
    ["Bagaimana memindahkan proyek ke perangkat lain?", "Buka proyek, pilih Ekspor ZIP, lalu kirim file-nya ke perangkat lain (lewat WhatsApp, email, kabel USB, atau Google Drive). Di sana, buka Koleksi Campaign lalu pilih Impor ZIP. Foto pribadimu tidak pernah ikut di dalam ZIP."],
    ["Bisakah orang lain memakai campaign-ku?", "Bisa, dengan dua cara. Kirim file ZIP untuk diimpor, atau, kalau BingkaiKeren di-hosting di website sendiri, taruh PNG bingkai di situs yang sama lalu isi alamatnya di Edit campaign → Atur campaign → Link bingkai. Tombol Bagikan lalu memberi link yang langsung membuka editor dengan bingkaimu."],
    ["Cara install di Android?", "Buka BingkaiKeren di Chrome, ketuk menu ⋮, lalu pilih Instal aplikasi atau Tambahkan ke Layar utama. Setelah itu bisa dibuka seperti aplikasi biasa, juga saat offline."],
    ["Cara install di iPhone atau iPad?", "Buka di Safari, ketuk tombol Bagikan, lalu pilih Tambahkan ke Layar Utama."],
    ["Apakah bisa dipakai offline?", "Bisa, setelah aplikasi dibuka sekali saat ada internet. Mengedit, menyimpan, dan mengunduh semuanya jalan saat offline."],
    ["Kenapa hasil unduhan kecil atau buram?", "Unduhan memakai ukuran hasil campaign, bukan ukuran pratinjau di layar. Periksa Ukuran hasil di Edit campaign, dan pakai bingkai dengan lebar minimal 1080 piksel."],
    ["Bisa membuat twibbon video?", "Belum di versi ini. Twibbon bingkai dan twibbon latar sudah didukung penuh."]
  ];
  view.innerHTML = `
  <div class="page-head" style="align-items:center"><div style="display:flex;gap:18px;align-items:center"><img class="mascot" src="${ART.m3}" alt=""><div><h1>Bantuan</h1><p>Dari layar kosong sampai twibbon jadi dalam sekitar satu menit.</p></div></div></div>
  <ol class="steps" style="margin-bottom:40px">
    <li><div class="ftile">${icon("plus")}</div><strong>Buat campaign</strong><p>Ketuk Buat Bingkai, beri judul, lalu pilih Twibbon bingkai.</p></li>
    <li><div class="ftile">${icon("copy")}</div><strong>Upload bingkai</strong><p>PNG dengan bagian transparan. Periksa pratinjaunya, lalu simpan.</p></li>
    <li><div class="ftile">${icon("cloud")}</div><strong>Tambahkan foto</strong><p>Di editor, ketuk Upload foto. Geser untuk memindah, cubit atau scroll untuk zoom.</p></li>
    <li><div class="ftile">${icon("download")}</div><strong>Unduh</strong><p>Ketuk Unduh untuk gambar resolusi penuh, lalu bagikan.</p></li>
  </ol>
  <h2 style="margin-bottom:14px">Pintasan di editor</h2>
  <p class="muted" style="margin-bottom:28px;max-width:62ch">Geser dengan satu jari atau mouse untuk memindah foto. Cubit dengan dua jari untuk zoom dan memutar. Di komputer: scroll untuk zoom, tombol panah untuk menggeser sedikit, Ctrl+Z untuk urungkan, Ctrl+Shift+Z untuk ulangi.</p>
  <h2 style="margin-bottom:14px">Pertanyaan</h2>
  <div class="stack">${faq.map(([q, a]) => `<details class="faq"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join("")}</div>`;
}
</script>
<script>
"use strict";
/* ---------- CREATE CAMPAIGN WIZARD ---------- */
const Wizard = { draft: null, step: 1, fromTemplate: false, imgs: {} };
const WSTEPS = ["Informasi", "Jenis", "Upload", "Atur", "Simpan"];

async function viewCreate() {
  if (!Wizard.draft) { Wizard.draft = newProject(); Wizard.step = 1; }
  const d = Wizard.draft; Wizard.imgs = {};
  for (const k of ["frame", "background", "cover"]) if (d.assets[k]) { try { Wizard.imgs[k] = await blobToImage(d.assets[k]); } catch { } }
  renderWizard();
}
function renderWizard() {
  const d = Wizard.draft, s = Wizard.step, editing = !!d._existing;
  view.innerHTML = `
  <div class="page-head"><div><h1>${editing ? "Edit campaign" : "Buat bingkai campaign"}</h1>
    <p>${Wizard.fromTemplate ? "Bingkai contohmu sudah siap. Beri nama campaign dan periksa pengaturannya." : "Lima langkah singkat. Tidak ada yang diunggah; semuanya tetap di perangkat ini."}</p></div></div>
  <div class="wiz">
    <ol class="wiz-steps">${WSTEPS.map((n, i) => `<li ${i + 1 === s ? 'aria-current="step"' : ""} class="${i + 1 < s ? "done" : ""}"><b>${i + 1 < s ? "✓" : i + 1}</b>${n}</li>`).join("")}</ol>
    <section class="card wiz-panel" id="wpanel"></section>
  </div>`;
  ({ 1: stepInfo, 2: stepType, 3: stepUpload, 4: stepConfigure, 5: stepSave })[s]($("#wpanel"));
}
function wizFoot(nextLabel = "Lanjut", { back = true, nextDisabled = false } = {}) {
  return `<div class="wiz-foot">${back ? `<button class="btn btn-ghost" id="wBack">${icon("back")}Kembali</button>` : `<a class="btn btn-ghost" href="#home" id="wCancel">Batal</a>`}
    <button class="btn btn-primary" id="wNext" ${nextDisabled ? "disabled" : ""}>${esc(nextLabel)}</button></div>`;
}
function goStep(n) { Wizard.step = n; renderWizard(); window.scrollTo({ top: 0 }); }
function bindFoot(onNext) { const b = $("#wBack"); if (b) b.onclick = () => goStep(Wizard.step - 1); $("#wNext").onclick = onNext; const c = $("#wCancel"); if (c) c.onclick = () => { Wizard.draft = null; }; }

function dropZone(id, label, hint) {
  return `<label class="drop" id="${id}"><input type="file" accept="image/png,image/jpeg,image/webp">${icon("upload")}<strong>${label}</strong><span class="small muted">${hint}</span></label>`;
}
function bindDrop(el, onFile) {
  const inp = $("input", el);
  inp.onchange = () => inp.files[0] && onFile(inp.files[0]);
  el.addEventListener("dragover", e => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", e => { e.preventDefault(); el.classList.remove("over"); const f = e.dataTransfer.files[0]; if (f) onFile(f); });
}
function assetRow(key, label, extra = "") {
  const b = Wizard.draft.assets[key], img = Wizard.imgs[key];
  return `<div class="asset"><div class="thumb"><img src="${objURL(b)}" alt=""></div>
    <div class="asset-info"><strong>${label}</strong><span class="muted">${img ? `${img.naturalWidth} × ${img.naturalHeight} px · ` : ""}${fmtBytes(b.size)}</span>${extra}</div>
    <button class="btn btn-sm btn-ghost" data-replace="${key}">Ganti</button><button class="btn btn-sm btn-ghost btn-danger" data-remove="${key}" aria-label="Hapus ${label}">${icon("trash")}</button></div>`;
}
async function takeAsset(key, file, keepAlpha) {
  try {
    const r = await readImageFile(file, { keepAlpha });
    Wizard.draft.assets[key] = r.blob; Wizard.imgs[key] = r.img;
    if (key === "frame" && Wizard.draft.output.preset === "frame") Wizard.draft.output = { w: r.w, h: r.h, preset: "frame" };
    if (key === "background" && Wizard.draft.type === "background" && !Wizard.draft.assets.frame && Wizard.draft.output.preset === "frame") Wizard.draft.output = { w: r.w, h: r.h, preset: "frame" };
    if (r.resized) toast(`Gambar besar diperkecil ke ${r.w} × ${r.h} px agar aplikasi tetap lancar.`);
    return true;
  } catch (e) { toast(e.message, "err"); return false; }
}

/* STEP 1 */
function stepInfo(el) {
  const d = Wizard.draft;
  el.innerHTML = `<h2>Informasi campaign</h2><p>Judul dan deskripsi terlihat saat campaign dibagikan.</p>
    <div class="field"><label for="fTitle">Judul campaign</label><input id="fTitle" class="input" maxlength="120" value="${esc(d.title)}" placeholder="Contoh: Hari Guru Nasional 2026" required></div>
    <div class="field"><label for="fDesc">Deskripsi singkat <span class="muted">(opsional)</span></label><textarea id="fDesc" class="input" maxlength="600" placeholder="Campaign ini untuk apa?">${esc(d.description)}</textarea></div>
    <div class="field"><label for="fCat">Kategori</label><select id="fCat" class="input">${CATEGORIES.map(c => `<option ${c === d.category ? "selected" : ""}>${c}</option>`).join("")}</select></div>
    <div class="field"><span class="label">Gambar sampul <span class="muted">(opsional)</span></span>
      <div id="coverSlot">${d.assets.cover ? assetRow("cover", "Gambar sampul") : dropZone("coverDrop", "Pilih gambar sampul", "Tampil di kartu Koleksi. Disarankan persegi 1080 × 1080 px (PNG, JPG, atau WEBP, maks. 15 MB).")}</div></div>
    ${wizFoot("Lanjut", { back: false })}`;
  const save = () => { d.title = $("#fTitle").value.trim(); d.description = $("#fDesc").value.trim(); d.category = $("#fCat").value; };
  const slot = $("#coverSlot");
  const bindCover = () => {
    const dz = $("#coverDrop"); if (dz) bindDrop(dz, async f => { save(); if (await takeAsset("cover", f)) stepInfo(el); });
    slot.querySelectorAll("[data-replace]").forEach(b => b.onclick = async () => { const f = await pickFile("image/png,image/jpeg,image/webp"); if (f) { save(); if (await takeAsset("cover", f)) stepInfo(el); } });
    slot.querySelectorAll("[data-remove]").forEach(b => b.onclick = () => { save(); delete d.assets.cover; delete Wizard.imgs.cover; stepInfo(el); });
  };
  bindCover();
  bindFoot(() => { save(); if (!d.title) { toast("Isi judul campaign dulu untuk melanjutkan.", "err"); $("#fTitle").focus(); return; } goStep(2); });
}

/* STEP 2 */
function stepType(el) {
  const d = Wizard.draft;
  const art = {
    frame: `<svg class="art" viewBox="0 0 56 56"><rect x="3" y="3" width="50" height="50" rx="10" fill="#8B5CF6"/><circle cx="28" cy="28" r="15" fill="var(--surface)" stroke="#14123B" stroke-width="3"/></svg>`,
    background: `<svg class="art" viewBox="0 0 56 56"><rect x="3" y="3" width="50" height="50" rx="10" fill="#14123B"/><path d="M3 40l14-12 12 10 9-7 15 11v5a10 10 0 0 1-10 10H13A10 10 0 0 1 3 47z" fill="#8B5CF6"/><rect x="19" y="14" width="18" height="22" rx="4" fill="#fff"/></svg>`,
    video: `<svg class="art" viewBox="0 0 56 56"><rect x="3" y="3" width="50" height="50" rx="10" fill="var(--surface-2)" stroke="var(--line)"/><path d="M23 19l14 9-14 9z" fill="var(--muted)"/></svg>`
  };
  el.innerHTML = `<h2>Pilih jenis campaign</h2><p>Kebanyakan campaign memakai twibbon bingkai.</p>
    <div class="types">
      <button class="type" data-type="frame" aria-pressed="${d.type === "frame"}">${art.frame}<span class="pill brand">Disarankan</span><strong>Twibbon bingkai</strong><p>Bingkai PNG transparan yang diletakkan di atas foto setiap orang.</p></button>
      <button class="type" data-type="background" aria-pressed="${d.type === "background"}">${art.background}<span class="pill">Latar</span><strong>Twibbon latar</strong><p>Gambar latar di belakang foto. Bisa ditambah bingkai di atasnya.</p></button>
      <button class="type" disabled aria-disabled="true">${art.video}<span class="pill">Belum tersedia</span><strong>Twibbon video</strong><p>Bingkai animasi direncanakan untuk versi berikutnya.</p></button>
    </div>${wizFoot()}`;
  $(".types", el).onclick = e => { const b = e.target.closest("[data-type]"); if (!b) return; d.type = b.dataset.type; $$("[data-type]", el).forEach(x => x.setAttribute("aria-pressed", x === b)); };
  bindFoot(() => goStep(3));
}

/* STEP 3 */
function stepUpload(el) {
  const d = Wizard.draft, isFrame = d.type === "frame";
  let tNote = "";
  if (Wizard.imgs.frame) {
    const r = transparencyRatio(Wizard.imgs.frame);
    tNote = r < 0.02 ? `<span style="color:var(--danger)">Tidak ada bagian transparan. Foto akan tertutup bingkai ini.</span>` : `<span style="color:var(--brand-ink)">${Math.round(r * 100)}% transparan, cocok untuk bingkai.</span>`;
  }
  el.innerHTML = `<h2>Upload desain</h2><p>${isFrame ? "Upload bingkai. Bagian yang tembus pandang adalah tempat foto akan tampil." : "Upload latar. Foto diletakkan di atasnya, dan bingkai bisa ditambahkan di paling atas."}</p>
    <div class="field"><span class="label">${isFrame ? "Bingkai (PNG transparan)" : "Gambar latar"}</span>
      <div id="mainSlot">${(isFrame ? d.assets.frame : d.assets.background) ? assetRow(isFrame ? "frame" : "background", isFrame ? "Bingkai" : "Latar", isFrame ? tNote : "") : dropZone("mainDrop", isFrame ? "Pilih PNG bingkai" : "Pilih gambar latar", isFrame ? "PNG transparan paling bagus. Sampai 15 MB." : "PNG, JPG, atau WEBP sampai 15 MB.")}</div></div>
    ${!isFrame ? `<div class="field"><span class="label">Bingkai di atas <span class="muted">(opsional)</span></span>
      <div id="extraSlot">${d.assets.frame ? assetRow("frame", "Bingkai", tNote) : dropZone("extraDrop", "Pilih PNG bingkai", "Hiasan opsional di atas foto.")}</div></div>` : ""}
    ${wizFoot("Lanjut", { nextDisabled: isFrame ? !d.assets.frame : !d.assets.background })}`;
  const main = isFrame ? "frame" : "background";
  const handle = async (key, f) => { if (await takeAsset(key, f, key === "frame")) stepUpload(el); };
  const dz = $("#mainDrop"); if (dz) bindDrop(dz, f => handle(main, f));
  const ez = $("#extraDrop"); if (ez) bindDrop(ez, f => handle("frame", f));
  $$("[data-replace]", el).forEach(b => b.onclick = async () => { const f = await pickFile("image/png,image/jpeg,image/webp"); if (f) handle(b.dataset.replace, f); });
  $$("[data-remove]", el).forEach(b => b.onclick = () => { delete d.assets[b.dataset.remove]; delete Wizard.imgs[b.dataset.remove]; stepUpload(el); });
  bindFoot(() => goStep(4));
}

/* STEP 4 */
function stepConfigure(el) {
  const d = Wizard.draft, pl = d.placement;
  const ref = Wizard.imgs.frame || Wizard.imgs.background;
  const presetOpts = [ref ? `<option value="frame">Sama dengan ${Wizard.imgs.frame ? "bingkai" : "latar"} · ${ref.naturalWidth} × ${ref.naturalHeight}</option>` : "",
    ...SIZE_PRESETS.map(p => `<option value="${p.id}">${p.label}</option>`), `<option value="custom">Ukuran sendiri</option>`].join("");
  el.innerHTML = `<h2>Atur campaign</h2><p>Tentukan ukuran unduhan dan posisi awal foto. Setiap orang tetap bisa menggeser fotonya sendiri nanti.</p>
  <div class="config">
    <div><canvas id="cfgPrev"></canvas><p class="small muted" style="margin-top:8px;text-align:center">Pratinjau dengan foto contoh</p></div>
    <div>
      <div class="field"><label for="oPreset">Ukuran hasil</label><select id="oPreset" class="input">${presetOpts}</select>
        <div class="row" id="customRow" hidden><input id="oW" class="input" type="number" min="200" max="4096" style="width:120px" aria-label="Lebar dalam piksel"> × <input id="oH" class="input" type="number" min="200" max="4096" style="width:120px" aria-label="Tinggi dalam piksel"> px</div>
        <span class="hint">Unduhan memakai ukuran penuh ini, bukan ukuran pratinjau di layar. Maksimal 4096 px.</span></div>
      <div class="field"><span class="label">Penempatan foto</span><div class="seg" id="fitSeg"><button data-v="cover" aria-pressed="${pl.fit !== "contain"}">Penuhi bingkai</button><button data-v="contain" aria-pressed="${pl.fit === "contain"}">Tampilkan utuh</button></div></div>
      <div class="range"><div class="range-top"><label for="pZoom">Zoom awal</label><output id="pZoomO"></output></div><input type="range" id="pZoom" min="30" max="300" value="${Math.round(pl.zoom * 100)}"></div>
      <div class="range"><div class="range-top"><label for="pX">Posisi kiri–kanan</label><output id="pXO"></output></div><input type="range" id="pX" min="-50" max="50" value="${Math.round(pl.ox * 100)}"></div>
      <div class="range"><div class="range-top"><label for="pY">Posisi atas–bawah</label><output id="pYO"></output></div><input type="range" id="pY" min="-50" max="50" value="${Math.round(pl.oy * 100)}"></div>
      <div class="field" style="margin-top:14px"><label for="pFill">Warna area kosong</label><input type="color" id="pFill" value="${d.fill}" style="width:56px;height:44px;border:0;background:none"></div>
      <details class="faq" style="padding:12px 16px"><summary>Link bingkai untuk campaign yang di-hosting <span class="muted small">(opsional)</span></summary>
        <p class="small">Kalau BingkaiKeren di-hosting di website sendiri dan PNG bingkai ini juga diunggah ke sana, tempel alamat web bingkainya. Tombol Bagikan lalu memberi link yang membuka editor dengan bingkai ini.</p>
        <input id="pUrl" class="input" style="margin-top:10px" type="url" placeholder="https://situs-sekolah.sch.id/bingkai/campaign.png" value="${esc(d.templateUrl || "")}"></details>
    </div>
  </div>${wizFoot()}`;
  const sel = $("#oPreset");
  sel.value = d.output.preset === "frame" && !ref ? "square" : (d.output.preset || "custom");
  if (!sel.value) sel.value = "custom";
  const cv = $("#cfgPrev");
  const apply = () => {
    const v = sel.value; $("#customRow").hidden = v !== "custom";
    if (v === "frame" && ref) d.output = { w: ref.naturalWidth, h: ref.naturalHeight, preset: "frame" };
    else if (v === "custom") {
      let w = Math.round(+$("#oW").value || d.output.w), h = Math.round(+$("#oH").value || d.output.h);
      w = clamp(w, 200, 4096); h = clamp(h, 200, 4096);
      if (w * h > LIMITS.maxPixels) { const r = Math.sqrt(LIMITS.maxPixels / (w * h)); w = Math.floor(w * r); h = Math.floor(h * r); }
      d.output = { w, h, preset: "custom" };
    } else { const p = SIZE_PRESETS.find(x => x.id === v); d.output = { w: p.w, h: p.h, preset: v }; }
    $("#oW").value = d.output.w; $("#oH").value = d.output.h;
    pl.zoom = +$("#pZoom").value / 100; pl.ox = +$("#pX").value / 100; pl.oy = +$("#pY").value / 100; d.fill = $("#pFill").value.toUpperCase();
    $("#pZoomO").textContent = Math.round(pl.zoom * 100) + "%"; $("#pXO").textContent = (pl.ox > 0 ? "+" : "") + Math.round(pl.ox * 100) + "%"; $("#pYO").textContent = (pl.oy > 0 ? "+" : "") + Math.round(pl.oy * 100) + "%";
    const k = Math.min(1, 640 / Math.max(d.output.w, d.output.h));
    cv.width = Math.round(d.output.w * k); cv.height = Math.round(d.output.h * k);
    const ph = samplePhoto();
    compose(cv.getContext("2d"), { W: d.output.w, H: d.output.h, k, fill: d.fill, bg: Wizard.imgs.background, frame: Wizard.imgs.frame, photo: ph, ps: initialPhotoState(ph, d) });
  };
  $("#oW").value = d.output.w; $("#oH").value = d.output.h;
  [sel, $("#oW"), $("#oH")].forEach(i => i.onchange = apply);
  ["#pZoom", "#pX", "#pY", "#pFill"].forEach(s => $(s).oninput = apply);
  $("#fitSeg").onclick = e => { const b = e.target.closest("button"); if (!b) return; pl.fit = b.dataset.v; $$("#fitSeg button").forEach(x => x.setAttribute("aria-pressed", x === b)); apply(); };
  apply();
  bindFoot(() => {
    const u = $("#pUrl").value.trim();
    if (u && !/^https?:\/\//i.test(u)) { toast("Link bingkai harus diawali http:// atau https://", "err"); return; }
    d.templateUrl = u; goStep(5);
  });
}

/* STEP 5 */
async function stepSave(el) {
  const d = Wizard.draft;
  el.innerHTML = `<h2>Simpan campaign</h2><p>Periksa detailnya, lalu simpan di perangkat ini.</p>
    <div class="summary"><canvas id="sumPrev" style="width:100%;border-radius:14px;box-shadow:var(--shadow)"></canvas>
    <dl><dt>Judul</dt><dd>${esc(d.title)}</dd><dt>Jenis</dt><dd>${TYPE_LABEL[d.type]}</dd><dt>Kategori</dt><dd>${esc(d.category)}</dd><dt>Ukuran</dt><dd>${d.output.w} × ${d.output.h} px</dd></dl></div>
    <div class="note" style="margin-top:20px">${icon("info")}<span>Proyekmu disimpan di perangkat dan browser ini. Tidak perlu akun.</span></div>
    ${wizFoot(d._existing ? "Simpan perubahan" : "Simpan dan buka editor")}`;
  const c = $("#sumPrev"), k = Math.min(1, 280 / Math.max(d.output.w, d.output.h)); c.width = d.output.w * k; c.height = d.output.h * k;
  const ph = samplePhoto();
  compose(c.getContext("2d"), { W: d.output.w, H: d.output.h, k, fill: d.fill, bg: Wizard.imgs.background, frame: Wizard.imgs.frame, photo: ph, ps: initialPhotoState(ph, d) });
  bindFoot(async () => {
    const btn = $("#wNext"); btn.disabled = true; btn.textContent = "Menyimpan…";
    try {
      const p = { ...d, assets: { ...d.assets } };
      const existing = p._existing ? await DB.get(p.id) : null; delete p._existing;
      if (existing && (existing.output.w !== p.output.w || existing.output.h !== p.output.h) && p.editor) p.editor = null;
      p.updatedAt = Date.now();
      p.assets.preview = await renderPreviewBlob(p);
      await DB.put(p);
      toast(existing ? "Perubahan disimpan." : "Campaign tersimpan di perangkat ini.");
      const go = existing ? "project-" + p.id : "editor-" + p.id;
      Wizard.draft = null; Wizard.imgs = {}; Wizard.fromTemplate = false;
      location.hash = go;
    } catch (e) { toast(e.message || "Gagal menyimpan.", "err"); btn.disabled = false; btn.textContent = "Coba lagi"; }
  });
}
</script>
<script>
"use strict";
/* ---------- TWIBBON EDITOR ---------- */
let Ed = null;
let QuickStart = null; // { frameBlob, title } when opened from a campaign link

function rangeRow(id, label, min, max, step = 1) {
  return `<div class="range"><div class="range-top"><label for="${id}">${label}</label><output id="${id}O"></output></div><input type="range" id="${id}" min="${min}" max="${max}" step="${step}"></div>`;
}
async function viewEditor(id, preset) {
  let p;
  if (preset) p = preset;
  else if (id) {
    p = await DB.get(id);
    if (!p) { view.innerHTML = emptyState(ART.m0, "Proyek tidak ditemukan", "Mungkin sudah dihapus, atau disimpan di browser atau perangkat lain.", `<a class="btn btn-primary" href="#projects">Buka koleksi</a>`); return; }
  } else {
    p = newProject(); p._quick = true; p.title = "Twibbon cepat";
    if (QuickStart) { p.assets.frame = QuickStart.frameBlob; p.title = QuickStart.title || "Twibbon campaign"; QuickStart = null; }
  }
  document.body.classList.add("in-editor");
  Ed = { p, imgs: { frame: null, bg: null, photo: null }, photoBlob: null, ps: null, hist: [], fut: [], tool: null, saveTimer: 0, pending: false, cleanup: [] };
  try {
    if (p.assets.frame) Ed.imgs.frame = await blobToImage(p.assets.frame);
    if (p.assets.background) Ed.imgs.bg = await blobToImage(p.assets.background);
    if (p.assets.photo) { Ed.imgs.photo = await blobToImage(p.assets.photo); Ed.photoBlob = p.assets.photo; }
  } catch (e) { toast("Beberapa gambar di proyek ini tidak bisa dibuka.", "err"); }
  if (p._quick && !p._campaign && Ed.imgs.frame) p.output = { w: Ed.imgs.frame.naturalWidth, h: Ed.imgs.frame.naturalHeight, preset: "frame" };
  if (Ed.imgs.photo) Ed.ps = (p.editor && p.editor.photo) ? { ...p.editor.photo, crop: { ...p.editor.photo.crop } } : initialPhotoState(Ed.imgs.photo, p);
  Ed.hist = [snap()];
  const back = p._quick ? "#home" : "#project-" + p.id;
  if (p._campaign && !Prefs.get("seenCampaignTip")) { setTimeout(() => toast("Ketuk area foto atau tombol Upload untuk memasang fotomu."), 600); Prefs.set("seenCampaignTip", true); }

  view.innerHTML = `
  <div class="editor" id="editor">
    <header class="ed-top">
      <a class="btn btn-ghost icon-btn" href="${back}" aria-label="Kembali">${icon("back")}</a>
      <div class="ed-title"><strong>${esc(p.title || "Tanpa judul")}</strong><span class="save-state" id="saveState"></span></div>
      <button class="btn btn-ghost icon-btn" id="bUndo" aria-label="Urungkan" title="Urungkan (Ctrl+Z)">${icon("undo")}</button>
      <button class="btn btn-ghost icon-btn" id="bRedo" aria-label="Ulangi" title="Ulangi (Ctrl+Shift+Z)">${icon("redo")}</button>
      <button class="btn btn-ghost icon-btn hide-m" id="bReset" aria-label="Reset foto" title="Reset foto">${icon("reset")}</button>
      <span class="sep hide-m"></span>
      <button class="btn btn-ghost" id="bPreview" aria-label="Pratinjau">${icon("eye")}<span class="hide-m">Pratinjau</span></button>
      <button class="btn btn-primary hide-m" id="bDownload">${icon("download")}Unduh</button>
    </header>

    <aside class="ed-left">
      <h4>Foto</h4>
      <button class="btn btn-primary" data-do="photo">${icon("upload")}<span data-photo-label>Upload foto</span></button>
      <h4>Desain campaign</h4>
      <button class="btn" data-do="frame">${icon("frame")}<span data-frame-label>Upload bingkai</span></button>
      <button class="btn" data-do="bg">${icon("layers")}<span data-bg-label>Tambah latar</span></button>
      <button class="btn btn-ghost btn-danger" data-do="nobg" hidden>${icon("trash")}Hapus latar</button>
      <h4>Alat gambar</h4>
      <button class="btn" data-do="fill">${icon("frame")}Penuhi bingkai</button>
      <button class="btn" data-do="fit">${icon("image")}Tampilkan utuh</button>
      <button class="btn" data-do="center">${icon("move")}Ke tengah</button>
      <button class="btn" data-do="mirror">${icon("flip")}Cermin</button>
      ${p._quick ? `<h4>Simpan</h4><button class="btn" data-do="saveproj">${icon("folder")}Simpan sebagai proyek</button>` : ""}
    </aside>

    <main class="ed-stage" id="stage">
      <canvas id="edCanvas" tabindex="0" aria-label="Kanvas twibbon. Geser untuk memindah foto, tombol panah untuk menggeser sedikit, plus dan minus untuk zoom."></canvas>
      <p class="stage-hint" id="hint"></p>
    </main>

    <aside class="ed-right" id="edRight">
      <section class="tool m-only" data-tool="upload">
        <button class="btn btn-primary" data-do="photo">${icon("upload")}<span data-photo-label>Upload foto</span></button>
        <div class="row"><button class="btn" data-do="frame" style="flex:1">${icon("frame")}<span data-frame-label>Bingkai</span></button>
        <button class="btn" data-do="bg" style="flex:1">${icon("layers")}<span data-bg-label>Latar</span></button></div>
        <button class="btn btn-ghost btn-danger" data-do="nobg" hidden>${icon("trash")}Hapus latar</button>
        <div class="row"><button class="btn btn-sm" data-do="mirror" style="flex:1">${icon("flip")}Cermin</button><button class="btn btn-sm" data-do="center" style="flex:1">${icon("move")}Ke tengah</button></div>
        ${p._quick ? `<button class="btn" data-do="saveproj">${icon("folder")}Simpan sebagai proyek</button>` : ""}
      </section>
      <section class="tool" data-tool="zoom">
        <div class="tool-head"><h3>Zoom</h3><div class="row"><button class="btn btn-sm icon-btn" data-do="zout" aria-label="Perkecil">−</button><button class="btn btn-sm icon-btn" data-do="zin" aria-label="Perbesar">+</button></div></div>
        ${rangeRow("rZoom", "Ukuran", 10, 500)}
        <div class="row"><button class="btn btn-sm" data-do="fill" style="flex:1">Penuhi bingkai</button><button class="btn btn-sm" data-do="fit" style="flex:1">Tampilkan utuh</button></div>
      </section>
      <section class="tool" data-tool="position">
        <div class="tool-head"><h3>Posisi</h3><button class="btn btn-sm" data-do="center">Ke tengah</button></div>
        ${rangeRow("rX", "Kiri / kanan", -100, 100)}
        ${rangeRow("rY", "Atas / bawah", -100, 100)}
        <div class="nudge"><span></span><button class="btn" data-nudge="0,-1" aria-label="Geser ke atas">↑</button><span></span>
          <button class="btn" data-nudge="-1,0" aria-label="Geser ke kiri">←</button><button class="btn" data-do="center" aria-label="Ke tengah">•</button><button class="btn" data-nudge="1,0" aria-label="Geser ke kanan">→</button>
          <span></span><button class="btn" data-nudge="0,1" aria-label="Geser ke bawah">↓</button><span></span></div>
      </section>
      <section class="tool" data-tool="rotate">
        <div class="tool-head"><h3>Putar</h3><button class="btn btn-sm" data-do="straight">Luruskan</button></div>
        ${rangeRow("rRot", "Sudut", -180, 180)}
        <div class="row"><button class="btn btn-sm" data-do="r-90" style="flex:1">${icon("undo")}90°</button><button class="btn btn-sm" data-do="r90" style="flex:1">90°${icon("redo")}</button><button class="btn btn-sm" data-do="mirror" style="flex:1">${icon("flip")}Cermin</button></div>
      </section>
      <section class="tool" data-tool="crop">
        <div class="tool-head"><h3>Potong foto</h3><button class="btn btn-sm" data-do="nocrop">Hapus potongan</button></div>
        ${rangeRow("cL", "Potong kiri", 0, 45)}${rangeRow("cR", "Potong kanan", 0, 45)}${rangeRow("cT", "Potong atas", 0, 45)}${rangeRow("cB", "Potong bawah", 0, 45)}
      </section>
      <section class="tool m-hide" data-tool="output">
        <div class="tool-head"><h3>Hasil</h3><span class="pill" id="outPill"></span></div>
        <div class="seg" id="edFmt">${["png", "jpg"].map(t => `<button data-v="${t}" aria-pressed="${t === Prefs.get("format")}">${t.toUpperCase()}</button>`).join("")}</div>
        <label class="row small" style="justify-content:space-between">Warna area kosong <input type="color" id="edFill" value="${p.fill || "#FFFFFF"}" style="width:48px;height:36px;border:0;background:none"></label>
        <p class="small muted">Unduhan dibuat pada ukuran hasil penuh, bukan ukuran layar.</p>
      </section>
    </aside>

    <nav class="ed-bottom" aria-label="Alat editor">
      <button data-tool-btn="upload">${icon("upload")}Upload</button>
      <button data-tool-btn="zoom">${icon("zoom")}Zoom</button>
      <button data-tool-btn="position">${icon("move")}Posisi</button>
      <button data-tool-btn="rotate">${icon("rotate")}Putar</button>
      <button data-tool-btn="crop">${icon("crop")}Potong</button>
      <button data-do="reset">${icon("reset")}Reset</button>
      <button data-do="download" class="primary">${icon("download")}Unduh</button>
    </nav>
  </div>`;

  const cv = $("#edCanvas"), ctx = cv.getContext("2d"), stage = $("#stage");
  Ed.cv = cv; Ed.ctx = ctx;

  /* sizing */
  const fitCanvas = () => {
    const W = Ed.p.output.w, H = Ed.p.output.h, mob = matchMedia("(max-width:1023px)").matches;
    const aw = stage.clientWidth - (mob ? 28 : 56), ah = stage.clientHeight - (mob ? 52 : 80);
    const r = Math.max(0.01, Math.min(aw / W, ah / H));
    const cw = Math.max(60, Math.floor(W * r)), ch = Math.max(60, Math.floor(H * r));
    cv.style.width = cw + "px"; cv.style.height = ch + "px";
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    draw(true);
  };
  Ed.fit = fitCanvas;
  const ro = new ResizeObserver(() => fitCanvas()); ro.observe(stage);
  Ed.cleanup.push(() => ro.disconnect());
  fitCanvas();
  updateUI();

  /* pointer gestures: drag, pinch-zoom, two-finger rotate */
  const pts = new Map(); let g = null;
  const toOut = (e) => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * Ed.p.output.w / r.width, y: (e.clientY - r.top) * Ed.p.output.h / r.height }; };
  const startGesture = () => {
    const a = [...pts.values()];
    if (a.length === 1) return { mode: "drag", start: a[0], ps: { ...Ed.ps } };
    const [p1, p2] = a; return { mode: "pinch", ps: { ...Ed.ps }, dist: Math.hypot(p2.x - p1.x, p2.y - p1.y) || 1, ang: Math.atan2(p2.y - p1.y, p2.x - p1.x), mid: { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 } };
  };
  cv.addEventListener("pointerdown", e => {
    if (!Ed.imgs.photo) { pickPhoto(); return; }
    cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, toOut(e)); g = startGesture(); e.preventDefault();
  });
  cv.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId) || !g) return;
    pts.set(e.pointerId, toOut(e)); const a = [...pts.values()];
    if (g.mode === "drag" && a.length === 1) { Ed.ps.cx = g.ps.cx + a[0].x - g.start.x; Ed.ps.cy = g.ps.cy + a[0].y - g.start.y; }
    else if (g.mode === "pinch" && a.length >= 2) {
      const [p1, p2] = a, d = Math.hypot(p2.x - p1.x, p2.y - p1.y), ang = Math.atan2(p2.y - p1.y, p2.x - p1.x), mid = { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
      const s = clampScale(g.ps.s * d / g.dist), ratio = s / g.ps.s, dA = ang - g.ang, cos = Math.cos(dA), sin = Math.sin(dA);
      const vx = g.ps.cx - g.mid.x, vy = g.ps.cy - g.mid.y;
      Ed.ps.s = s; Ed.ps.cx = mid.x + (vx * cos - vy * sin) * ratio; Ed.ps.cy = mid.y + (vx * sin + vy * cos) * ratio;
      Ed.ps.rot = normDeg(g.ps.rot + dA * 180 / Math.PI);
    }
    draw(); syncControls();
  });
  const endPtr = e => { if (!pts.has(e.pointerId)) return; pts.delete(e.pointerId); if (pts.size === 0) { g = null; commit(); } else g = startGesture(); };
  cv.addEventListener("pointerup", endPtr); cv.addEventListener("pointercancel", endPtr); cv.addEventListener("lostpointercapture", endPtr);
  let wheelT = 0;
  cv.addEventListener("wheel", e => {
    if (!Ed.ps) return; e.preventDefault();
    const pt = toOut(e), s = clampScale(Ed.ps.s * Math.exp(-e.deltaY * 0.0015)), r = s / Ed.ps.s;
    Ed.ps.cx = pt.x + (Ed.ps.cx - pt.x) * r; Ed.ps.cy = pt.y + (Ed.ps.cy - pt.y) * r; Ed.ps.s = s;
    draw(); syncControls(); clearTimeout(wheelT); wheelT = setTimeout(commit, 350);
  }, { passive: false });
  cv.addEventListener("keydown", e => {
    if (!Ed.ps) return; const step = (e.shiftKey ? 0.05 : 0.01) * Ed.p.output.w; let hit = true;
    if (e.key === "ArrowLeft") Ed.ps.cx -= step; else if (e.key === "ArrowRight") Ed.ps.cx += step;
    else if (e.key === "ArrowUp") Ed.ps.cy -= step; else if (e.key === "ArrowDown") Ed.ps.cy += step;
    else if (e.key === "+" || e.key === "=") zoomBy(1.06, false); else if (e.key === "-") zoomBy(1 / 1.06, false); else hit = false;
    if (hit) { e.preventDefault(); draw(); syncControls(); clearTimeout(wheelT); wheelT = setTimeout(commit, 350); }
  });
  const onKey = e => {
    if (e.target.matches("input,textarea,select")) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    else if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
  };
  window.addEventListener("keydown", onKey); Ed.cleanup.push(() => window.removeEventListener("keydown", onKey));
  const onHide = () => { if (document.visibilityState === "hidden") flushSave(); };
  document.addEventListener("visibilitychange", onHide); Ed.cleanup.push(() => document.removeEventListener("visibilitychange", onHide));

  /* sliders */
  const bindRange = (id, apply) => { const el = $("#" + id); el.addEventListener("input", () => { if (!Ed.ps) return; apply(+el.value); draw(); syncControls(); }); el.addEventListener("change", commit); };
  bindRange("rZoom", v => { const base = baseScale(Ed.imgs.photo, Ed.ps.crop, Ed.p.output.w, Ed.p.output.h); Ed.ps.s = clampScale(base * v / 100); });
  bindRange("rX", v => { Ed.ps.cx = Ed.p.output.w * (0.5 + v / 200); });
  bindRange("rY", v => { Ed.ps.cy = Ed.p.output.h * (0.5 + v / 200); });
  bindRange("rRot", v => { Ed.ps.rot = v; });
  [["cL", "l"], ["cR", "r"], ["cT", "t"], ["cB", "b"]].forEach(([id, k]) => bindRange(id, v => { Ed.ps.crop[k] = v / 100; }));
  $("#edFmt").onclick = e => { const b = e.target.closest("button"); if (!b) return; Prefs.set("format", b.dataset.v); $$("#edFmt button").forEach(x => x.setAttribute("aria-pressed", x === b)); };
  $("#edFill").oninput = e => { Ed.p.fill = e.target.value.toUpperCase(); draw(); };
  $("#edFill").onchange = () => scheduleSave();

  /* buttons */
  const ed = $("#editor");
  ed.addEventListener("click", async e => {
    const tb = e.target.closest("[data-tool-btn]");
    if (tb) { const t = tb.dataset.toolBtn; setTool(Ed.tool === t ? null : t); return; }
    const nb = e.target.closest("[data-nudge]");
    if (nb && Ed.ps) { const [dx, dy] = nb.dataset.nudge.split(",").map(Number); Ed.ps.cx += dx * Ed.p.output.w * 0.02; Ed.ps.cy += dy * Ed.p.output.h * 0.02; draw(); syncControls(); commit(); return; }
    const b = e.target.closest("[data-do]"); if (!b) return;
    const act = b.dataset.do;
    if (act === "photo") return pickPhoto();
    if (act === "frame") return pickFrame();
    if (act === "bg") return pickBg();
    if (act === "nobg") { delete Ed.p.assets.background; Ed.imgs.bg = null; draw(); scheduleSave(); return rerenderPanels(); }
    if (act === "saveproj") return saveQuickAsProject();
    if (act === "download") return doDownload();
    if (act === "reset") return resetPhoto();
    if (!Ed.ps) { toast("Upload foto dulu."); return; }
    const W = Ed.p.output.w, H = Ed.p.output.h;
    if (act === "fill" || act === "fit") { Ed.ps.s = baseScale(Ed.imgs.photo, Ed.ps.crop, W, H, act === "fit" ? "contain" : "cover"); Ed.ps.cx = W / 2; Ed.ps.cy = H / 2; if (Math.abs(Ed.ps.rot) % 90) Ed.ps.rot = 0; }
    if (act === "center") { Ed.ps.cx = W / 2; Ed.ps.cy = H / 2; }
    if (act === "mirror") Ed.ps.flip = !Ed.ps.flip;
    if (act === "straight") Ed.ps.rot = 0;
    if (act === "r90") Ed.ps.rot = normDeg(Math.round(Ed.ps.rot / 90) * 90 + 90);
    if (act === "r-90") Ed.ps.rot = normDeg(Math.round(Ed.ps.rot / 90) * 90 - 90);
    if (act === "nocrop") Ed.ps.crop = { l: 0, t: 0, r: 0, b: 0 };
    if (act === "zin") zoomBy(1.12, false);
    if (act === "zout") zoomBy(1 / 1.12, false);
    draw(); syncControls(); commit();
  });
  $("#bUndo").onclick = undo; $("#bRedo").onclick = redo; $("#bReset").onclick = resetPhoto;
  $("#bPreview").onclick = doPreview; $("#bDownload").onclick = doDownload;
  setTool(null); rerenderPanels();
}

function rerenderPanels() {
  // Refresh labels and canvas size after the frame or background changes.
  if (!Ed) return;
  $$("[data-frame-label]").forEach(el => el.textContent = el.closest(".tool") ? "Bingkai" : (Ed.imgs.frame ? "Ganti bingkai" : "Upload bingkai"));
  $$("[data-bg-label]").forEach(el => el.textContent = el.closest(".tool") ? "Latar" : (Ed.imgs.bg ? "Ganti latar" : "Tambah latar"));
  $$("[data-do=nobg]").forEach(el => el.hidden = !Ed.imgs.bg);
  const pill = $("#outPill"); if (pill) pill.textContent = `${Ed.p.output.w} × ${Ed.p.output.h} px`;
  Ed.fit && Ed.fit(); updateUI();
}
function setTool(t) {
  if (!Ed) return; Ed.tool = t;
  $$(".ed-right .tool").forEach(s => s.classList.toggle("active", s.dataset.tool === t));
  $$("[data-tool-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.toolBtn === t));
  $("#edRight").classList.toggle("open", !!t);
}
const normDeg = d => { d = ((d + 180) % 360 + 360) % 360 - 180; return Math.round(d * 10) / 10; };
function clampScale(s) {
  if (!Ed.imgs.photo) return s;
  const base = baseScale(Ed.imgs.photo, Ed.ps.crop, Ed.p.output.w, Ed.p.output.h);
  return clamp(s, base * 0.05, base * 12);
}
function zoomBy(f) { Ed.ps.s = clampScale(Ed.ps.s * f); }

let rafId = 0;
function draw(now = false) {
  if (!Ed) return;
  const go = () => { rafId = 0; if (!Ed || !Ed.cv) return;
    const W = Ed.p.output.w, H = Ed.p.output.h, k = Ed.cv.width / W;
    compose(Ed.ctx, { W, H, k, fill: Ed.p.fill, bg: Ed.imgs.bg, frame: Ed.imgs.frame, photo: Ed.imgs.photo, ps: Ed.ps, placeholder: matchMedia("(pointer:coarse)").matches ? "Ketuk untuk menambah foto" : "Klik untuk menambah foto" }); };
  if (now) { cancelAnimationFrame(rafId); go(); } else if (!rafId) rafId = requestAnimationFrame(go);
}
function syncControls() {
  if (!Ed || !Ed.ps) return;
  const W = Ed.p.output.w, H = Ed.p.output.h, ps = Ed.ps;
  const base = baseScale(Ed.imgs.photo, ps.crop, W, H);
  const set = (id, v, txt) => { const el = $("#" + id); if (!el) return; el.value = v; $("#" + id + "O").textContent = txt; };
  const z = Math.round(ps.s / base * 100); set("rZoom", clamp(z, 10, 500), z + "%");
  const x = Math.round((ps.cx / W - 0.5) * 200), y = Math.round((ps.cy / H - 0.5) * 200);
  set("rX", clamp(x, -100, 100), (x > 0 ? "+" : "") + x); set("rY", clamp(y, -100, 100), (y > 0 ? "+" : "") + y);
  set("rRot", ps.rot, Math.round(ps.rot) + "°");
  set("cL", Math.round(ps.crop.l * 100), Math.round(ps.crop.l * 100) + "%"); set("cR", Math.round(ps.crop.r * 100), Math.round(ps.crop.r * 100) + "%");
  set("cT", Math.round(ps.crop.t * 100), Math.round(ps.crop.t * 100) + "%"); set("cB", Math.round(ps.crop.b * 100), Math.round(ps.crop.b * 100) + "%");
}
function updateUI() {
  if (!Ed) return;
  const has = !!Ed.imgs.photo;
  $("#bUndo").disabled = Ed.hist.length < 2; $("#bRedo").disabled = !Ed.fut.length;
  $$("[data-photo-label]").forEach(s => s.textContent = has ? "Ganti foto" : "Upload foto");
  $$(".ed-right input[type=range]").forEach(i => i.disabled = !has);
  const hint = $("#hint");
  hint.textContent = !Ed.imgs.frame && !Ed.imgs.bg ? "Tambahkan bingkai dan foto untuk mulai" : !has ? "Tambahkan foto untuk mulai" : matchMedia("(pointer:coarse)").matches ? "Geser untuk memindah, cubit untuk zoom dan putar" : "Geser untuk memindah, scroll untuk zoom";
  const st = $("#saveState");
  st.innerHTML = Ed.p._campaign ? "Campaign siap pakai" : Ed.p._quick ? "Belum disimpan, twibbon cepat" : !DB.ok ? "Tidak tersimpan, penyimpanan tidak tersedia" : Ed.pending ? "Menyimpan…" : "<i></i>Tersimpan di perangkat ini";
  syncControls();
}

/* history */
function snap() { return Ed.ps ? JSON.stringify(Ed.ps) : null; }
function commit() {
  if (!Ed) return; const s = snap();
  if (Ed.hist[Ed.hist.length - 1] === s) return;
  Ed.hist.push(s); if (Ed.hist.length > 60) Ed.hist.shift(); Ed.fut = [];
  updateUI(); scheduleSave();
}
function restore(s) { Ed.ps = s ? JSON.parse(s) : null; draw(); updateUI(); scheduleSave(); }
function undo() { if (!Ed || Ed.hist.length < 2) return; Ed.fut.push(Ed.hist.pop()); restore(Ed.hist[Ed.hist.length - 1]); }
function redo() { if (!Ed || !Ed.fut.length) return; const s = Ed.fut.pop(); Ed.hist.push(s); restore(s); }
function resetPhoto() {
  if (!Ed.imgs.photo) { toast("Belum ada yang bisa di-reset."); return; }
  Ed.ps = initialPhotoState(Ed.imgs.photo, Ed.p); draw(); commit(); toast("Foto di-reset. Pakai Urungkan untuk kembali.");
}

/* uploads */
async function pickPhoto() {
  const f = await pickFile("image/png,image/jpeg,image/webp"); if (!f) return;
  try {
    const r = await readImageFile(f);
    Ed.imgs.photo = r.img; Ed.photoBlob = r.blob; Ed.ps = initialPhotoState(r.img, Ed.p);
    Ed.hist = [snap()]; Ed.fut = []; draw(); updateUI(); scheduleSave();
    if (matchMedia("(max-width:1023px)").matches) setTool(null);
  } catch (e) { toast(e.message, "err"); }
}
function rescaleOutput(w, h) {
  const o = Ed.p.output; if (o.w === w && o.h === h) return;
  if (Ed.ps) { const fx = w / o.w, fy = h / o.h; Ed.ps.cx *= fx; Ed.ps.cy *= fy; Ed.ps.s *= Math.sqrt(fx * fy); Ed.hist = [snap()]; Ed.fut = []; }
  Ed.p.output = { w, h, preset: "frame" };
}
async function pickFrame() {
  const f = await pickFile("image/png,image/webp"); if (!f) return;
  try {
    const r = await readImageFile(f, { keepAlpha: true });
    if (transparencyRatio(r.img) < 0.02) toast("Bingkai ini tidak punya bagian transparan, jadi foto akan tertutup seluruhnya.", "err");
    Ed.p.assets.frame = r.blob; Ed.imgs.frame = r.img;
    if (Ed.p._quick || Ed.p.output.preset === "frame") rescaleOutput(r.w, r.h);
    scheduleSave(); rerenderPanels();
  } catch (e) { toast(e.message, "err"); }
}
async function pickBg() {
  const f = await pickFile("image/png,image/jpeg,image/webp"); if (!f) return;
  try {
    const r = await readImageFile(f);
    Ed.p.assets.background = r.blob; Ed.imgs.bg = r.img;
    if (Ed.p._quick && !Ed.imgs.frame) rescaleOutput(r.w, r.h);
    scheduleSave(); rerenderPanels();
  } catch (e) { toast(e.message, "err"); }
}

/* autosave (saved projects only) */
function scheduleSave() {
  if (!Ed || Ed.p._quick) return;
  Ed.pending = true; updateSaveState();
  clearTimeout(Ed.saveTimer); Ed.saveTimer = setTimeout(flushSave, 700);
}
function updateSaveState() { const st = $("#saveState"); if (st && Ed) st.innerHTML = Ed.pending ? "Menyimpan…" : "<i></i>Tersimpan di perangkat ini"; }
async function flushSave() {
  if (!Ed || Ed.p._quick || !Ed.pending) return;
  clearTimeout(Ed.saveTimer);
  const E = Ed, p = E.p;
  try {
    p.editor = E.ps ? { photo: E.ps } : null;
    if (E.photoBlob) p.assets.photo = E.photoBlob;
    const k = Math.min(1, 520 / Math.max(p.output.w, p.output.h));
    const c = makeCanvas(Math.round(p.output.w * k), Math.round(p.output.h * k));
    const ph = E.imgs.photo || samplePhoto(), ps = E.imgs.photo ? E.ps : initialPhotoState(ph, p);
    compose(c.getContext("2d"), { W: p.output.w, H: p.output.h, k, fill: p.fill, bg: E.imgs.bg, frame: E.imgs.frame, photo: ph, ps });
    p.assets.preview = await canvasToBlob(c, "image/png");
    p.updatedAt = Date.now();
    const rec = { ...p, assets: { ...p.assets } }; delete rec._quick;
    await DB.put(rec);
    E.pending = false; if (Ed === E) updateSaveState();
  } catch (e) { E.pending = false; toast(e.message || "Perubahan gagal disimpan di perangkat ini.", "err"); }
}
async function saveQuickAsProject() {
  if (!Ed.imgs.frame && !Ed.imgs.bg) { toast("Tambahkan bingkai dulu, lalu simpan sebagai proyek."); return; }
  if (!DB.ok) { toast("Browser ini tidak bisa menyimpan proyek. Unduh gambarmu saja.", "err"); return; }
  openDialog(`<form method="dialog" class="dlg"><h2>Simpan sebagai proyek</h2><p class="muted">Bingkai dan fotomu saat ini disimpan di perangkat ini.</p>
    <div class="field"><label for="qTitle">Judul campaign</label><input id="qTitle" class="input" maxlength="120" required value="${esc(Ed.p.title === "Twibbon cepat" ? "" : Ed.p.title)}" placeholder="Contoh: Hari Guru Nasional 2026"></div>
    <div class="dlg-foot"><button class="btn" value="no">Batal</button><button class="btn btn-primary" value="yes" id="qOk">Simpan proyek</button></div></form>`);
  $("#qOk").onclick = async (e) => {
    const t = $("#qTitle").value.trim(); if (!t) { e.preventDefault(); toast("Isi judulnya dulu."); return; }
    const p = Ed.p; delete p._quick; p.title = t; p.type = Ed.imgs.frame ? "frame" : "background"; p.createdAt = p.updatedAt = Date.now();
    if (!p.output.preset) p.output.preset = "frame";
    Ed.pending = true; await flushSave(); toast("Tersimpan di Koleksi Campaign.");
    location.hash = "editor-" + p.id;
  };
}

/* preview & export */
async function renderFull() {
  const { w: W, h: H } = Ed.p.output, c = makeCanvas(W, H);
  compose(c.getContext("2d"), { W, H, k: 1, fill: Ed.p.fill, bg: Ed.imgs.bg, frame: Ed.imgs.frame, photo: Ed.imgs.photo, ps: Ed.ps });
  const fmt = Prefs.get("format");
  const blob = await canvasToBlob(c, fmt === "jpg" ? "image/jpeg" : "image/png", Prefs.get("quality") / 100);
  c.width = c.height = 0; // release memory early (iOS)
  return { blob, ext: fmt === "jpg" ? "jpg" : "png" };
}
async function doPreview() {
  if (!Ed.imgs.frame && !Ed.imgs.bg && !Ed.imgs.photo) { toast("Tambahkan bingkai dan foto dulu."); return; }
  try {
    const { blob } = await renderFull(); const u = URL.createObjectURL(blob);
    openDialog(`<div class="dlg"><h2>Pratinjau</h2><img class="preview-img" src="${u}" alt="Pratinjau twibbon akhir">
      <p class="small muted" style="text-align:center">${Ed.p.output.w} × ${Ed.p.output.h} px · ${fmtBytes(blob.size)} · persis seperti yang akan diunduh</p>
      <div class="dlg-foot"><button class="btn" id="pvClose">Lanjut edit</button><button class="btn btn-primary" id="pvDl">${icon("download")}Unduh</button></div></div>`, { wide: true, onClose: () => URL.revokeObjectURL(u) });
    $("#pvClose").onclick = closeDialog; $("#pvDl").onclick = () => { closeDialog(); doDownload(); };
  } catch (e) { toast(e.message, "err"); }
}
async function doDownload() {
  if (!Ed.imgs.photo) { toast("Tambahkan fotomu dulu, lalu unduh."); pickPhoto(); return; }
  try {
    const { blob, ext } = await renderFull();
    const name = `${slug(Ed.p.title)}-bingkaikeren.${ext}`;
    if (await saveFile(blob, name)) openShareDialog({ title: (Ed.p._quick && !Ed.p._campaign) ? "" : Ed.p.title, project: Ed.p._quick ? null : Ed.p, blob, filename: name, link: Ed.p._campaign ? campaignURL(Ed.p._campaign) : undefined });
  } catch (e) { toast(e.message || "Gambar gagal dibuat.", "err"); }
}
function leaveEditor() {
  if (!Ed) return;
  flushSave();
  Ed.cleanup.forEach(f => f()); Ed.cleanup = [];
  Ed = null; document.body.classList.remove("in-editor");
}
</script>
<script>
"use strict";
/* ---------- ROUTER (plain #name hashes only) ---------- */
let routeToken = 0;
async function route() {
  const token = ++routeToken;
  const h = (location.hash || "#home").slice(1);
  if (Ed) leaveEditor();
  if (dlg.open) closeDialog();
  releaseViewURLs();
  document.body.classList.remove("in-editor");
  const navKey = h.startsWith("project-") || h.startsWith("editor") ? "projects" : h.startsWith("pakai-") ? "home" : h;
  $$("[data-nav]").forEach(a => { if (a.dataset.nav === navKey) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  try {
    if (h === "home") await viewHome();
    else if (h === "create") await viewCreate();
    else if (h === "projects") await viewProjects();
    else if (h.startsWith("project-")) await viewProject(h.slice(8));
    else if (h === "editor") await viewEditor(null);
    else if (h.startsWith("editor-")) await viewEditor(h.slice(7));
    else if (h.startsWith("pakai-")) {
      view.innerHTML = `<div class="empty"><img class="mascot" src="${ART.m3}" alt=""><h3>Menyiapkan bingkai…</h3></div>`;
      const c = (await loadCampaigns()).find(x => x.id === h.slice(6));
      if (token !== routeToken) return;
      if (!c) { view.innerHTML = emptyState(ART.m0, "Campaign tidak ditemukan", "Mungkin sudah tidak aktif atau link-nya salah ketik.", `<a class="btn btn-primary" href="#home">Lihat campaign lain</a>`); return; }
      const p = await campaignToProject(c);
      if (token !== routeToken) return;
      await viewEditor(null, p);
    }
    else if (h === "preferences") await viewPreferences();
    else if (h === "help") viewHelp();
    else { location.replace("#home"); return; }
  } catch (e) {
    console.error(e);
    if (token === routeToken) view.innerHTML = `<div class="empty"><h3>Halaman ini gagal dimuat</h3><p>${esc(e.message || e)}</p><a class="btn btn-primary" href="#home">Ke beranda</a></div>`;
  }
  if (token === routeToken && !document.body.classList.contains("in-editor")) { window.scrollTo(0, 0); }
}
window.addEventListener("hashchange", route);

/* ---------- campaign links: ?frame=<url>&title=<text> (self-hosted only) ---------- */
async function readCampaignLink() {
  let q; try { q = new URLSearchParams(location.search); } catch { return false; }
  const src = q.get("frame"); if (!src) return false;
  try {
    const url = new URL(src, location.href);
    if (!/^https?:$/.test(url.protocol)) throw new Error("bad");
    const res = await fetch(url.href, { mode: "cors" }); if (!res.ok) throw new Error("http");
    const blob = await res.blob();
    if (blob.size > LIMITS.fileBytes) throw new Error("big");
    const head = new Uint8Array(await blob.slice(0, 12).arrayBuffer()); const type = sniffType(head);
    if (!type) throw new Error("type");
    const typed = new Blob([blob], { type }); await blobToImage(typed);
    QuickStart = { frameBlob: typed, title: (q.get("title") || "").slice(0, 120) };
    history.replaceState(null, "", location.pathname + "#editor");
    return true;
  } catch {
    toast("Bingkai campaign dari link ini tidak bisa dimuat. Minta file ZIP-nya ke pengirim.", "err");
    history.replaceState(null, "", location.pathname + location.hash);
    return false;
  }
}

/* ---------- start ---------- */
(async function init() {
  const ok = await DB.open();
  $("#storageBanner").hidden = ok;
  const net = () => { $("#offlineBanner").hidden = navigator.onLine; };
  window.addEventListener("online", net); window.addEventListener("offline", net); net();
  if (await readCampaignLink()) { if (location.hash !== "#editor") location.hash = "editor"; }
  route();
  // Service worker: only on a real static host (not file://, not sandboxed previews).
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && window.isSecureContext) {
    try { await navigator.serviceWorker.register("./sw.js"); } catch (e) { /* preview environments without sw.js */ }
  }
})();
</script>
